    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: #071826;
      }

      * { box-sizing: border-box; }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #071826;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      }

      main { width: min(100%, 1280px); }

      .player {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .fallback {
        margin: 12px 0 0;
        text-align: center;
        font-size: 13px;
      }

      a { color: #ff8a1f; }
